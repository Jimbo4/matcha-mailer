; Copia questo file come config.ini (non viene caricato su GitHub) e completa i valori tra < >.

[mittente]
email = jacopo@matchadating.it
nome = Jacopo Marcolini
; indirizzi in copia, separati da virgola
cc = info@matchadating.it

[aruba]
smtp_host = smtps.aruba.it
smtp_port = 465
imap_host = imaps.aruba.it
imap_port = 993
; lascia vuoto per trovarla da sola (es. INBOX.Sent)
cartella_inviati =

[google]
; ID = la parte dell'URL tra /d/ e /edit
funnel_id = <ID del foglio Matcha - Funnel Vendita>
funnel_foglio = Sheet1
cronologia_doc_id = <ID del Doc Matcha - Funnel Vendita - cronologia modifiche>
lettera_doc_id = <ID del Doc lettera_intenti_v2>
lettera_nome_file = Lettera d'intenti Matcha.pdf
credenziali = secrets/credentials.json

[sequenza]
; giorni lavorativi tra mail 1 e mail 2, e tra mail 2 e mail 3
giorni_mail_2 = 4
giorni_mail_3 = 6
; oltre questa soglia settimanale il mailer chiede conferma (non blocca)
soglia_settimanale = 20
; quanti giorni indietro cercare risposte nella casella
giorni_controllo_risposte = 60
; pausa casuale tra un invio e l'altro, in secondi
pausa_min_secondi = 5
pausa_max_secondi = 30
